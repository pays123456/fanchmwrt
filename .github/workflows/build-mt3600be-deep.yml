name: Build GL-MT3600BE

on:
  workflow_dispatch:

env:
  FANCHM_REPO: https://github.com/pays123456/fanchmwrt
  FANCHM_BRANCH: fanchmwrt-25.12.4
  CONFIG_ITEM: CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt3600be

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 🛒 Checkout 仓库（获取 seed .config）
        uses: actions/checkout@v4

      - name: 🧹 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: 📦 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pip rsync swig unzip \
            zlib1g-dev file wget curl ccache libelf-dev device-tree-compiler \
            qemu-utils xsltproc

      - name: 🔄 克隆 FanchmWrt
        run: |
          git clone --depth=1 -b ${{ env.FANCHM_BRANCH }} ${{ env.FANCHM_REPO }} fanchmwrt
          cd fanchmwrt
          echo "FanchmWrt Branch: $(git branch --show-current)"

          # 验证 DTS 文件是否存在
          DTS_PATH="target/linux/mediatek/dts/mt7987a-glinet-gl-mt3600be.dts"
          if [ ! -f "$DTS_PATH" ]; then
            echo "❌ ERROR: DTS file not found at $DTS_PATH"
            exit 1
          fi
          echo "✅ DTS file verified."

      - name: 🔧 自动注入设备定义
        run: |
          cd fanchmwrt

          MK_FILE="target/linux/mediatek/image/filogic.mk"
          MARKER="# --- AUTO-INJECTED MT3600BE ---"

          # 如果还没注入，则追加
          if ! grep -q "$MARKER" "$MK_FILE"; then
            echo "Injecting device definition into $MK_FILE ..."

            # 使用 printf 逐行写入，避免 YAML heredoc 解析问题
            {
              printf '\n%s\n' "# --- AUTO-INJECTED MT3600BE ---"
              printf '%s\n' "define Device/glinet_gl-mt3600be"
              printf '%s\n' "  DEVICE_VENDOR := GL.iNet"
              printf '%s\n' "  DEVICE_MODEL := GL-MT3600BE"
              printf '%s\n' "  DEVICE_DTS := mt7987a-glinet-gl-mt3600be"
              printf '%s\n' "  DEVICE_DTS_DIR := ../dts"
              printf '%s\n' "  DEVICE_PACKAGES := kmod-mt7996-firmware uboot-envtools"
              printf '%s\n' "  BLOCKSIZE := 128k"
              printf '%s\n' "  PAGESIZE := 2048"
              printf '%s\n' "  KERNEL_IN_UBI := 1"
              printf '%s\n' "  UBINIZE_OPTS := -E 5"
              printf '%s\n' "  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata"
              printf '%s\n' "endef"
              printf '%s\n' "TARGET_DEVICES += glinet_gl-mt3600be"
              printf '%s\n' "# --- END AUTO-INJECTED MT3600BE ---"
            } >> "$MK_FILE"

            echo "✅ Definition injected."
          else
            echo "⚠️ Definition already exists, skipping."
          fi

      - name: ⚙️ 配置与编译
        run: |
          cd fanchmwrt

          # 更新 feeds（必须在注入设备定义之后执行，确保新增设备/自定义包被完整识别）
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 使用独立 seed .config（行首无空格，避免 YAML heredoc 缩进污染）
          # 该文件是「差异配置」，后续由 make defconfig 展开为完整 .config
          cp "$GITHUB_WORKSPACE/configs/mt3600be.config" .config

          echo "Running defconfig (expand seed config)..."
          make defconfig

          # 验证设备是否被识别
          if grep -q "^${{ env.CONFIG_ITEM }}=y" .config; then
            echo "✅ Device successfully recognized in config."
          else
            echo "❌ ERROR: Device not found in config after defconfig."
            echo "--- relevant CONFIG_TARGET lines ---"
            grep -E '^CONFIG_TARGET' .config || true
            exit 1
          fi

          echo "🚀 Starting compilation..."
          make -j$(nproc) download
          make -j$(nproc) || make -j1 V=s

      - name: 📤 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: GL-MT3600BE-Build-${{ github.run_number }}
          path: |
            fanchmwrt/bin/targets/mediatek/filogic/*sysupgrade*
            fanchmwrt/bin/targets/mediatek/filogic/*factory*
            fanchmwrt/bin/targets/mediatek/filogic/*.manifest
          retention-days: 7
